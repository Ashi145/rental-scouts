name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      AUTH_SECRET: "ci-test-auth-secret-0123456789abcd"
      LOCATION_FUZZ_SECRET: "ci-test-location-fuzz-secret-0123456789"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

      - name: Run TypeScript check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

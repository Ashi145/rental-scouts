services:
  - type: web
    name: rental-scout
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_PATH
        value: /var/data/rentalscout.sqlite
      # IMPORTANT: Generate these locally and add manually in Render Dashboard → Environment
      # Run: node -e "console.log('AUTH_SECRET=' + require('crypto').randomBytes(32).toString('base64url'))"
      # Run: node -e "console.log('LOCATION_FUZZ_SECRET=' + require('crypto').randomBytes(32).toString('base64url'))"
      # Run: node -e "console.log('SESSION_SECRET=' + require('crypto').randomBytes(32).toString('base64url'))"
      # Run: node -e "console.log('PAYMENT_WEBHOOK_SECRET=' + require('crypto').randomBytes(32).toString('base64url'))"
      - key: AUTH_SECRET
        sync: false
      - key: LOCATION_FUZZ_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
    disk:
      name: rental-scout-data
      mountPath: /var/data
      sizeGB: 1